post_ocr_findings:
- ★★ 본 기사 「宗敎의 六大要素」 = 종교 일반의 6요소 (①超人的勢力의信仰 ②希望 ③敬虔의念 ④救濟의信念 ⑤犧牲의精神 ⑥仁愛)를 정식화하고 *人乃天
  新宗敎*와 비교 — 이노우에 1915 C13·C14 「世界三大宗敎의 比較」와 평행하는 비교종교 양식.
- ★★ 결정적 정식 (unit_4): 「人乃天의 觀念으로 觀ᄒᆞ면 이는 自己以外의 偶像에 假托ᄒᆞ안이ᄒᆞ고 自己以內의 實在로 觀ᄒᆞ나니, 即 自己의
    意識을 大宇宙의 大意識의 系統으로 思ᄒᆞ고 그 偉大ᄒᆞᆫ 超現人의 勢力에 歸依코져 ᄒᆞᆷ이라」 — 이노우에 「現象即實在」 한국 변주의 정식
    표현. 「자기-외부 → 자기-내부」 내재화.
- 「現象意識의 人」 어휘 = 「現象即實在」에서 「現象」 직접 차용 (unit_4).
- 「儒敎의 [仁?] / 佛敎의 慈悲 / 基督의 愛」 3대 종교 仁愛 클러스터 (unit_3) = 이돈화 1924 단행본 C06-S06 「世界三大宗敎의
  差異点과 人乃天」의 직접 선행.
- 「事人如天」(unit_6) = 천도교 핵심 강령 + 「殺身成仁」 결합.
