post_ocr_findings:
  - 본 기사는 이돈화 1922 「死生觀」(개벽 20호) 직전 시점의 인생론 — 「人生은 神에 出ᄒᆞ야 神에 歸」 정식이 1922 死生觀 정초의 직접 선행.
  - ★ 「相對差別의 絶對平等에 歸ᄒᆞᄂᆞ 神의 解法」 (unit_8) = 절대-상대 변증의 천도교 정초.
  - 「西哲이 曰」 익명 인용 (unit_9) — Bergson/Schopenhauer 자장 가능성.
  - 본문 사이 인물 사진 3매 (奉訓 韓世敎 / 河花 趙錫然 / 奉訓 李養培) — 천도교 인물.
  - unit_14 전체는 다음 기사 「觀」(金光熙) — meta.yaml role=tail → role=excluded 권장.

