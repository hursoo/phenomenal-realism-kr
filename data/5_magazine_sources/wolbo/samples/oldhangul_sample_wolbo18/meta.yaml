role:
  primary: secondary_sample_for_oldhangul_measurement
  rationale: |
    본 1편(article 01, 1911-01)은 한자 약 80% 강세이고 옛한글 자모(ㆍ, ᄒᆞ 등)가 거의
    없어 도구의 옛한글 인식 정확도를 측정할 수 없다. 본 표본은 표제부터 옛한글이
    명확하고 본문에도 ᄒᆞ 결합형이 빈출하므로 옛한글 변수 측정에 적합하다.
    Phase 2.4 도구 비교에서 본 1편(한자 변수)과 본 부 표본(옛한글 변수)을 함께
    입력하여 두 변수를 별개로 평가한다.

